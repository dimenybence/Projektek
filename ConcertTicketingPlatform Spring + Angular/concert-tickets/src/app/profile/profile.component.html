<app-nav-bar></app-nav-bar>

<div class="container mt-4">
  <h2>Profil</h2>
  <form (ngSubmit)="updateProfile()">
    <div class="mb-3">
      <label for="name" class="form-label">Név</label>
      <input type="text" id="name" [(ngModel)]="user.name" name="name" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" [(ngModel)]="user.email" name="email" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Jelszó</label>
      <input type="password" id="password" [(ngModel)]="user.password" name="password" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary me-2">Frissítés</button>
    <button type="button" class="btn btn-secondary" (click)="navigateToHome()">Mégse</button>
  </form>
</div>
