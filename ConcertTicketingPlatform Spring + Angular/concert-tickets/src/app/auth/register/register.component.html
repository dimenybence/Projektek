<div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card shadow">
          <div class="card-header bg-primary text-white">
            <h2 class="text-center">Regisztráció</h2>
          </div>
          <div class="card-body">
            <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
              <div class="mb-3">
                <label for="name" class="form-label">Név</label>
                <input
                  type="text"
                  id="name"
                  class="form-control"
                  [(ngModel)]="name"
                  name="name"
                  required
                />
              </div>
  
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  [(ngModel)]="email"
                  name="email"
                  required
                  pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$"
                  #emailInput="ngModel"
                />
                <div *ngIf="emailInput.errors?.['pattern']">Adj meg email cím formátumot!</div>
              </div>
  
              <div class="mb-3">
                <label for="password" class="form-label">Jelszó</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  [(ngModel)]="password"
                  name="password"
                  required
                  minlength="6"
                  #passwordInput="ngModel"
                />
                <div *ngIf="passwordInput.errors?.['minlength']">A jelszó hossza legalább 6 karakter legyen!</div>
              </div>
  
              <div class="d-grid">
                <button type="submit" class="btn btn-primary" [disabled]="registerForm.invalid">Regisztráció</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
